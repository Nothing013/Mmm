name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Restore release keystore
        if: ${{ github.event_name == 'push' && secrets.DASHDAZZ_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.DASHDAZZ_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/dashdazz.keystore.jks

      - name: Build release APK
        if: ${{ github.event_name == 'push' && secrets.DASHDAZZ_KEYSTORE_BASE64 != '' && secrets.DASHDAZZ_STORE_PASSWORD != '' && secrets.DASHDAZZ_KEY_PASSWORD != '' && secrets.DASHDAZZ_KEY_ALIAS != '' }}
        env:
          STORE_PASS: ${{ secrets.DASHDAZZ_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DASHDAZZ_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DASHDAZZ_KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace "-Pdashdazz.storePassword=$STORE_PASS" "-Pdashdazz.keyPassword=$KEY_PASS" "-Pdashdazz.keyAlias=$KEY_ALIAS"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DashDazz-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: ${{ github.event_name == 'push' && secrets.DASHDAZZ_KEYSTORE_BASE64 != '' && secrets.DASHDAZZ_STORE_PASSWORD != '' && secrets.DASHDAZZ_KEY_PASSWORD != '' && secrets.DASHDAZZ_KEY_ALIAS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DashDazz-release
          path: app/build/outputs/apk/release/*.apk
